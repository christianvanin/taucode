<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Leggera sfumatura chiaro/bianca come nell'immagine originale -->
    <linearGradient id="tauLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#ebebeb" />
    </linearGradient>

    <!-- Ombra leggerissima per dare profondità sul chiaro -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Tracciato vettoriale fedele del simbolo Tau (τ) -->
  <path d="M 866 105 
           L 866 235 
           L 594 235 
           L 558 550 
           C 541 700, 575 762, 650 762 
           C 715 762, 752 720, 768 663 
           L 804 663 
           C 790 815, 705 906, 565 906 
           C 440 906, 387 810, 412 630 
           L 466 235 
           L 375 235 
           C 270 235, 215 270, 177 355 
           L 140 355 
           C 190 200, 260 105, 400 105 
           Z" fill="url(#tauLightGrad)" filter="url(#softShadow)" />
</svg>
